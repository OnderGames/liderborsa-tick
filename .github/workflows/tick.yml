name: tick

on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offset
        uses: actions/cache@v4
        with:
          path: telegram_offset.txt
          key: tg-offset
      - name: Komut
        id: tg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poll.py
      - name: Liste tara
        if: steps.tg.outputs.need_scan == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh workflow run "Cloud tarama" --repo OnderGames/LiderBorsa             -f "market=${{ steps.tg.outputs.market }}"             -f notify_all=true
      - name: Tekrar dinle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          sleep 180
          gh workflow run tick --repo OnderGames/liderborsa-tick
